<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サル目撃マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #2d6a4f;
    --green-light: #52b788;
    --green-pale: #d8f3dc;
    --brown: #7f4f24;
    --brown-light: #dda15e;
    --cream: #fefae0;
    --gray: #6c757d;
    --shadow: 0 2px 12px rgba(0,0,0,0.12);
  }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: var(--cream);
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--green);
    color: white;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    z-index: 1000;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  .badge {
    background: var(--brown-light);
    color: var(--brown);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .main { flex: 1; display: flex; flex-direction: row; overflow: hidden; position: relative; }
  #map { flex: 1; z-index: 1; min-width: 0; }

  /* サイドパネル（常時表示） */
  .side-panel {
    width: 300px;
    flex-shrink: 0;
    background: white;
    border-left: 1px solid #e8e8e8;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: -2px 0 10px rgba(0,0,0,0.06);
    z-index: 10;
  }
  .side-panel-header {
    background: var(--green);
    color: white;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .side-panel-header .sp-count {
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
  }
  .side-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }

  /* スマホではサイドパネルを非表示にしてボタンを残す */
  @media (max-width: 640px) {
    .main { flex-direction: column; }
    .side-panel { display: none; }
    .list-btn { display: flex; }
  }
  @media (min-width: 641px) {
    .list-btn { display: none; }
  }

  /* 浮くボタン */
  .fab {
    position: absolute;
    bottom: 24px;
    right: 16px;
    z-index: 999;
    background: var(--brown);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(127,79,36,0.45);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .fab:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(127,79,36,0.55); }
  .fab:active { transform: scale(0.97); }

  .list-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 999;
    background: white;
    color: var(--green);
    border: 2px solid var(--green-pale);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
    font-family: inherit;
    transition: background 0.15s;
  }
  .list-btn:hover { background: var(--green-pale); }

  /* ピックモードバナー */
  .pick-banner {
    display: none;
    position: absolute;
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--brown);
    color: white;
    border-radius: 999px;
    padding: 8px 22px;
    font-size: 13px;
    font-weight: 700;
    z-index: 999;
    white-space: nowrap;
    box-shadow: var(--shadow);
    pointer-events: none;
  }
  .pick-banner.show { display: block; pointer-events: auto; }
  #map.picking { cursor: crosshair; }

  /* パネル（ボトムシート） */
  .panel-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 2000;
    align-items: flex-end;
    justify-content: center;
  }
  .panel-overlay.open { display: flex; }
  .panel {
    background: white;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 540px;
    padding: 20px 20px 36px;
    max-height: 88vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }

  .panel-handle { width: 40px; height: 4px; background: #ddd; border-radius: 999px; margin: 0 auto 18px; }
  .panel h2 { font-size: 17px; font-weight: 700; color: var(--green); margin-bottom: 18px; }

  /* フォーム */
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    margin-top: 16px;
  }
  .form-label:first-child { margin-top: 0; }
  input[type="text"], input[type="datetime-local"], select, textarea {
    width: 100%;
    border: 1.5px solid #e0e0e0;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    color: #1a1a1a;
    background: #fafafa;
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--green-light); background: white; }
  textarea { resize: vertical; min-height: 76px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .loc-box {
    background: var(--green-pale);
    border: 1.5px solid var(--green-light);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    color: var(--green);
    font-weight: 600;
  }
  .btn-pick-map {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-pick-map:hover { opacity: 0.85; }
  .btn-pick-map.picked { background: var(--green-light); }

  .loc-hint { font-size: 12px; color: var(--gray); margin-top: 8px; margin-bottom: 4px; }

  .pick-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .btn-pick-gps {
    display: block; width: 100%; padding: 10px;
    background: #1d6fa4; color: white; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  .btn-pick-gps:hover { opacity: 0.85; }
  .btn-pick-gps:disabled { background: #aaa; cursor: not-allowed; }

  .coord-edit-row {
    margin-top: 10px; background: #f0f7ff; border: 1.5px solid #a8d4f5;
    border-radius: 10px; padding: 10px 12px;
    display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end;
  }
  .coord-field { display: flex; flex-direction: column; gap: 3px; }
  .coord-label { font-size: 11px; font-weight: 700; color: #1d6fa4; }
  .coord-edit-row input {
    padding: 8px 10px; font-size: 13px;
    border: 1.5px solid #a8d4f5; border-radius: 8px; background: white; margin: 0;
  }
  .btn-coord-apply {
    padding: 8px 12px; background: #1d6fa4; color: white; border: none;
    border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .btn-coord-apply:hover { opacity: 0.85; }

  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn-primary { background: var(--green); color: white; }
  .btn-primary:hover { opacity: 0.87; }
  .btn-cancel { background: #f0f0f0; color: var(--gray); }
  .btn-cancel:hover { background: #e5e5e5; }

  /* 一覧カード */
  .sighting-card {
    background: #fafafa;
    border: 1.5px solid #ececec;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .sighting-card:hover { border-color: var(--green-light); background: #f5fdf7; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-place { font-weight: 700; font-size: 14px; color: var(--brown); }
  .card-date { font-size: 12px; color: var(--gray); white-space: nowrap; }
  .card-count { display: inline-block; background: var(--green-pale); color: var(--green); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 5px; }
  .card-note { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.5; }
  .card-delete { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 6px; transition: color 0.15s; }
  .card-delete:hover { color: #e63946; }

  .empty-msg { text-align: center; color: var(--gray); padding: 36px 0; font-size: 14px; line-height: 2; }

  /* ポップアップ */
  .leaflet-popup-content-wrapper { border-radius: 14px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important; }
  .popup-inner { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; min-width: 190px; }
  .popup-title { font-weight: 700; font-size: 15px; color: var(--brown); margin-bottom: 5px; }
  .popup-count { display: inline-block; background: var(--green-pale); color: var(--green); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-bottom: 5px; }
  .popup-meta { font-size: 12px; color: var(--gray); margin-bottom: 5px; }
  .popup-note { font-size: 13px; color: #444; line-height: 1.5; }

  /* トースト */
  .toast {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: white;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🐒 サル目撃マップ</h1>
  <span class="badge" id="total-badge">読み込み中...</span>
</header>

<div class="main">
  <div id="map"></div>
  <div class="pick-banner" id="pick-banner">📍 場所をタップ ／ <span onclick="cancelPick()" style="text-decoration:underline;cursor:pointer;">キャンセル</span></div>
  <button class="fab" onclick="startAdd()">＋ 目撃を報告</button>
  <button class="list-btn" onclick="openList()">📋 目撃一覧</button>

  <!-- 常時表示サイドパネル（PC用） -->
  <div class="side-panel">
    <div class="side-panel-header">
      📋 目撃一覧
      <span class="sp-count" id="sp-count">0件</span>
    </div>
    <div class="side-list" id="side-list-content">
      <div class="empty-msg">まだ目撃情報がありません。<br>「＋ 目撃を報告」から<br>最初の情報を登録してみましょう！</div>
    </div>
  </div>
</div>

<!-- 報告フォームパネル -->
<div class="panel-overlay" id="form-panel">
  <div class="panel">
    <div class="panel-handle"></div>
    <h2>🐒 目撃を報告する</h2>

    <span class="form-label">📍 場所</span>
    <div class="loc-box" id="loc-display">まだ選択されていません</div>
    <div class="pick-btn-row">
      <button class="btn-pick-map" id="btn-pick-map" onclick="pickOnMap()">🗺️ 地図で選ぶ</button>
      <button class="btn-pick-gps" id="btn-pick-gps" onclick="useCurrentLocation()">📡 現在地を使う</button>
    </div>
    <div class="coord-edit-row" id="coord-edit-row" style="display:none;">
      <div class="coord-field">
        <label class="coord-label">緯度</label>
        <input type="text" id="edit-lat" placeholder="例: 34.46705" inputmode="decimal">
      </div>
      <div class="coord-field">
        <label class="coord-label">経度</label>
        <input type="text" id="edit-lng" placeholder="例: 131.77312" inputmode="decimal">
      </div>
      <button class="btn-coord-apply" onclick="applyCoordEdit()">地図に反映</button>
    </div>
    <p class="loc-hint">＋ 地名・目印も入力できます（任意）</p>
    <input type="text" id="loc-name" placeholder="例：○○地区の集会所付近、津和野町役場旧庁舎周辺" maxlength="60">

    <div class="row2">
      <div>
        <span class="form-label">📅 日時</span>
        <input type="datetime-local" id="sighting-date">
      </div>
      <div>
        <span class="form-label">🐒 頭数</span>
        <select id="sighting-count">
          <option>1頭</option>
          <option>2〜3頭</option>
          <option>4〜5頭</option>
          <option>6〜10頭</option>
          <option>10頭以上</option>
          <option>不明</option>
        </select>
      </div>
    </div>

    <span class="form-label">📝 状況メモ（任意）</span>
    <textarea id="sighting-note" placeholder="例：畑に侵入していた、子ザル連れ、農作物を食べていた、追いかけても逃げなかった　など"></textarea>

    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeForm()">キャンセル</button>
      <button class="btn btn-primary" onclick="submitSighting()">報告する</button>
    </div>
  </div>
</div>

<!-- 一覧パネル -->
<div class="panel-overlay" id="list-panel">
  <div class="panel">
    <div class="panel-handle"></div>
    <h2>📋 目撃一覧</h2>
    <div id="list-content"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-cancel" onclick="closeList()">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================
//  地図初期化
// =====================
const map = L.map('map').setView([34.4670512, 131.7731237], 13);
// 航空写真（Esri World Imagery）
const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
    maxZoom: 19
  }
);

// 地名ラベル（航空写真に重ねる）
const labels = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
    opacity: 0.5
  }
);

satellite.addTo(map);
labels.addTo(map);

// 地図切り替えコントロール
const baseMaps = {
  '🛰️ 航空写真': satellite,
  '🗺️ 地図': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  })
};
const overlays = { '🏷️ 地名ラベル': labels };
L.control.layers(baseMaps, overlays, { position: 'topright' }).addTo(map);

function makeIcon() {
  return L.divIcon({
    html: '<div style="font-size:28px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));">🐒</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    className: ''
  });
}

// =====================
//  状態
// =====================
let sightings = [];
let markerMap = {}; // id -> L.marker
let pickingMode = false;
let pickedLat = null;
let pickedLng = null;
let tempMarker = null;

// =====================
//  データ保存・読込
//  ※ localStorage を使用（ブラウザごとにデータを保持）
// =====================
const STORAGE_KEY = 'saru_sightings_v1';

function loadSightings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    sightings = raw ? JSON.parse(raw) : [];
  } catch(e) {
    sightings = [];
  }
  renderMarkers();
  updateBadge();
}

function saveSightings() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sightings));
}

// =====================
//  マーカー描画
// =====================
function renderMarkers() {
  Object.values(markerMap).forEach(m => map.removeLayer(m));
  markerMap = {};
  sightings.forEach(s => addMarker(s));
  renderSideList();
}

function addMarker(s) {
  if (!s.lat || !s.lng) return;
  const m = L.marker([s.lat, s.lng], { icon: makeIcon() })
    .addTo(map)
    .bindPopup(`
      <div class="popup-inner">
        <div class="popup-title">🐒 ${escHtml(s.locName || '場所名なし')}</div>
        <div class="popup-count">${escHtml(s.count)}</div>
        <div class="popup-meta">${escHtml(s.date)}</div>
        ${s.note ? `<div class="popup-note">${escHtml(s.note)}</div>` : ''}
      </div>
    `, { maxWidth: 250 });
  markerMap[s.id] = m;
}

function updateBadge() {
  document.getElementById('total-badge').textContent = `目撃 ${sightings.length}件`;
  // サイドパネルのカウントも更新
  const sp = document.getElementById('sp-count');
  if (sp) sp.textContent = `${sightings.length}件`;
}

function renderSideList() {
  const el = document.getElementById('side-list-content');
  if (!el) return;
  if (sightings.length === 0) {
    el.innerHTML = '<div class="empty-msg">まだ目撃情報がありません。<br>「＋ 目撃を報告」から<br>最初の情報を登録してみましょう！</div>';
  } else {
    el.innerHTML = sightings.map(s => `
      <div class="sighting-card" onclick="flyToSighting(${s.id})">
        <div class="card-head">
          <span class="card-place">🐒 ${escHtml(s.locName)}</span>
          <button class="card-delete" onclick="deleteSighting(event,${s.id})" title="削除">✕</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;">
          <span class="card-count">${escHtml(s.count)}</span>
          <span class="card-date">${escHtml(s.date)}</span>
        </div>
        ${s.note ? `<div class="card-note">${escHtml(s.note)}</div>` : ''}
      </div>
    `).join('');
  }
}

// =====================
//  報告フォーム
// =====================
function startAdd() {
  pickedLat = null;
  pickedLng = null;
  document.getElementById('loc-display').textContent = 'まだ選択されていません';
  document.getElementById('loc-name').value = '';
  document.getElementById('sighting-note').value = '';
  const btn = document.getElementById('btn-pick-map');
  btn.textContent = '🗺️ 地図で選ぶ';
  btn.classList.remove('picked');
  const gpsBtn = document.getElementById('btn-pick-gps');
  gpsBtn.textContent = '📡 現在地を使う';
  gpsBtn.disabled = false;
  document.getElementById('coord-edit-row').style.display = 'none';
  document.getElementById('edit-lat').value = '';
  document.getElementById('edit-lng').value = '';

  // 現在時刻をデフォルト
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const local = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById('sighting-date').value = local;

  openForm();
}

function openForm() {
  document.getElementById('form-panel').classList.add('open');
  // ピックモードは自動開始しない（ボタンから明示的に開始する）
}

function closeForm() {
  document.getElementById('form-panel').classList.remove('open');
  exitPickMode();
  if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
}

function exitPickMode() {
  pickingMode = false;
  document.getElementById('map').classList.remove('picking');
  document.getElementById('pick-banner').classList.remove('show');
  // パネルが隠れていたら再表示（念のため）
  document.getElementById('form-panel').style.display = '';
}

function enterPickMode() {
  pickingMode = true;
  document.getElementById('map').classList.add('picking');
  document.getElementById('pick-banner').classList.add('show');
}

function cancelPick() {
  exitPickMode();
  document.getElementById('form-panel').style.display = '';
}

function pickOnMap() {
  // フォームパネルを一時的に隠して地図をタップできるようにする
  document.getElementById('form-panel').style.display = 'none';
  enterPickMode();
}

map.on('click', function(e) {
  if (!pickingMode) return;
  exitPickMode();
  // パネルを再表示
  document.getElementById('form-panel').style.display = '';
  setPickedCoords(e.latlng.lat, e.latlng.lng);
  showToast('📍 場所を選択しました。座標の微調整も可能です。');
});

// =====================
//  現在地・座標編集
// =====================
function useCurrentLocation() {
  if (!navigator.geolocation) {
    showToast('❌ このブラウザでは現在地取得に対応していません');
    return;
  }
  const gpsBtn = document.getElementById('btn-pick-gps');
  gpsBtn.textContent = '⏳ 取得中...';
  gpsBtn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      pickedLat = pos.coords.latitude;
      pickedLng = pos.coords.longitude;
      setPickedCoords(pickedLat, pickedLng);
      gpsBtn.textContent = '✅ 現在地を取得済み';
      showToast('📡 現在地を取得しました。必要に応じて座標を修正できます。');
      // 地図をその地点に移動
      map.flyTo([pickedLat, pickedLng], 15, { duration: 1 });
    },
    function(err) {
      gpsBtn.textContent = '📡 現在地を使う';
      gpsBtn.disabled = false;
      if (err.code === 1) {
        showToast('❌ 位置情報の使用が許可されていません');
      } else {
        showToast('❌ 現在地の取得に失敗しました');
      }
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function setPickedCoords(lat, lng) {
  pickedLat = lat;
  pickedLng = lng;
  document.getElementById('loc-display').textContent =
    `緯度 ${lat.toFixed(5)}　経度 ${lng.toFixed(5)}`;
  // 座標編集欄を表示・更新
  document.getElementById('edit-lat').value = lat.toFixed(6);
  document.getElementById('edit-lng').value = lng.toFixed(6);
  document.getElementById('coord-edit-row').style.display = '';
  // 仮マーカー更新
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.circleMarker([lat, lng], {
    radius: 11, color: '#c1121f', fillColor: '#e63946', fillOpacity: 0.45, weight: 2.5
  }).addTo(map);
  // 地図ピックボタンも「選び直す」に
  const btn = document.getElementById('btn-pick-map');
  btn.textContent = '🗺️ 地図で選び直す';
  btn.classList.add('picked');
}

function applyCoordEdit() {
  const latVal = parseFloat(document.getElementById('edit-lat').value);
  const lngVal = parseFloat(document.getElementById('edit-lng').value);
  if (isNaN(latVal) || isNaN(lngVal)) {
    showToast('⚠️ 緯度・経度に正しい数値を入力してください');
    return;
  }
  if (latVal < 30 || latVal > 46 || lngVal < 129 || lngVal > 146) {
    showToast('⚠️ 入力した座標が日本の範囲外です');
    return;
  }
  setPickedCoords(latVal, lngVal);
  map.flyTo([latVal, lngVal], 15, { duration: 0.8 });
  showToast('📍 座標を更新しました');
}

// =====================
//  送信処理
// =====================
function submitSighting() {
  const locName = document.getElementById('loc-name').value.trim();
  const dateVal = document.getElementById('sighting-date').value;
  const count   = document.getElementById('sighting-count').value;
  const note    = document.getElementById('sighting-note').value.trim();

  if (!pickedLat && !locName) {
    showToast('📍 地図で場所を選択するか、地名を入力してください');
    return;
  }

  const entry = {
    id: Date.now(),
    lat: pickedLat,
    lng: pickedLng,
    locName: locName || '（地名なし）',
    date: dateVal ? fmtDate(dateVal) : '日時不明',
    count,
    note
  };

  sightings.unshift(entry);
  saveSightings();
  addMarker(entry);
  updateBadge();
  renderSideList();
  closeForm();

  if (pickedLat && pickedLng) {
    map.flyTo([pickedLat, pickedLng], 15, { duration: 1.2 });
    setTimeout(() => markerMap[entry.id]?.openPopup(), 1400);
  }
  showToast('✅ 目撃情報を報告しました！');
}

function fmtDate(s) {
  const d = new Date(s);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// =====================
//  一覧パネル
// =====================
function openList() {
  const el = document.getElementById('list-content');
  if (sightings.length === 0) {
    el.innerHTML = '<div class="empty-msg">まだ目撃情報がありません。<br>「＋ 目撃を報告」から最初の情報を登録してみましょう！</div>';
  } else {
    el.innerHTML = sightings.map(s => `
      <div class="sighting-card" onclick="flyToSighting(${s.id})">
        <div class="card-head">
          <span class="card-place">🐒 ${escHtml(s.locName)}</span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="card-date">${escHtml(s.date)}</span>
            <button class="card-delete" onclick="deleteSighting(event,${s.id})" title="削除">✕</button>
          </span>
        </div>
        <span class="card-count">${escHtml(s.count)}</span>
        ${s.note ? `<div class="card-note">${escHtml(s.note)}</div>` : ''}
      </div>
    `).join('');
  }
  document.getElementById('list-panel').classList.add('open');
}

function closeList() {
  document.getElementById('list-panel').classList.remove('open');
}

function flyToSighting(id) {
  const s = sightings.find(x => x.id === id);
  if (s && s.lat && s.lng) {
    // ボトムシートが開いていれば閉じる
    if (document.getElementById('list-panel').classList.contains('open')) closeList();
    map.flyTo([s.lat, s.lng], 15, { duration: 1 });
    setTimeout(() => markerMap[id]?.openPopup(), 1200);
  }
}

function deleteSighting(e, id) {
  e.stopPropagation();
  if (!confirm('この目撃情報を削除しますか？')) return;
  sightings = sightings.filter(s => s.id !== id);
  if (markerMap[id]) { map.removeLayer(markerMap[id]); delete markerMap[id]; }
  saveSightings();
  updateBadge();
  renderSideList();
  // スマホ（ボトムシート）が開いていれば更新
  if (document.getElementById('list-panel').classList.contains('open')) openList();
  showToast('🗑️ 削除しました');
}

// =====================
//  ユーティリティ
// =====================
function escHtml(s) {
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

// =====================
//  起動
// =====================
loadSightings();
</script>
</body>
</html>
